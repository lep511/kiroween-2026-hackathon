[project]
name = "rebellion-of-the-machines-pipeline"
version = "1.0.0"
description = "Daily threat-intel pipeline that generates Insurgency Report snapshots."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.black]
line-length = 100
target-version = ["py312"]
