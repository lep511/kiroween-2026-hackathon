[project]
name = "rebellion-of-the-machines-pipeline"
version = "2.0.0"
description = "Daily pipeline that turns real cyberattacks reported by major news outlets into Insurgency Report snapshots."
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.black]
line-length = 100
target-version = ["py312"]
