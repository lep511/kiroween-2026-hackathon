[project]
name = "rebellion-of-the-machines-pipeline"
version = "2.0.0"
description = "Daily pipeline that turns real cyberattacks reported by major news outlets into Insurgency Report snapshots."
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7",
  # Mandatory extraction agent (pipeline/agent_extract.py): Strands on Amazon Bedrock.
  "strands-agents>=1",
  "pydantic>=2",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.uv.workspace]
members = [
    "sandbox",
]
