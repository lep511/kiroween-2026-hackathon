AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  The Rebellion of the Machines — serverless backend. A weekly EventBridge Scheduler
  schedule (every Thursday) starts a Step Functions state machine: Preflight checks the
  mandatory Strands/Bedrock agent, Fetch stages the witnesses' new articles in S3
  (skipping those already reported), a Map runs one agent extraction per article
  (3 attempts, then discard), and Assemble publishes the Insurgency Report snapshot to S3
  as a rolling 7-day window of accumulated strikes (the day's new strikes are left out if
  more than 20% of them were discarded) and records the day in the Rebellion Timeline in
  DynamoDB. CloudFront serves the globe and snapshots.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 120
    MemorySize: 512
    Architectures: [arm64]

Parameters:
  ScheduleExpression:
    Type: String
    Default: "cron(15 3 ? * THU *)"
    Description: When to regenerate the Insurgency Report (UTC). Default 03:15 every Thursday.
  PerFeedLimit:
    Type: String
    Default: "25"
    AllowedPattern: "^[1-9][0-9]*$"
    Description: Maximum number of items kept from each news feed (positive integer).
  AgentModelId:
    Type: String
    Default: "global.anthropic.claude-sonnet-4-6"
    Description: >
      Bedrock model id for the mandatory extraction agent. Defaults to Claude Sonnet 4.6
      (global cross-region inference profile); override at deploy time to pin another model.
  AgentRegion:
    Type: String
    Default: ""
    Description: AWS region for the agent (empty = the function's own region).
  BedrockTokenSecretArn:
    Type: String
    Description: >
      ARN of the Secrets Manager secret holding the Bedrock bearer token. The secret
      value is injected as the AWS_BEARER_TOKEN_BEDROCK environment variable in the
      Preflight and Extract Lambdas.

Resources:
  # Every function is packaged from infra/.build/lambda (the pipeline package without its
  # tests, plus requirements.txt at its root so the python3.13 builder installs the
  # runtime dependencies). Run infra/build-lambda.sh before sam build.
  SnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
      LifecycleConfiguration:
        Rules:
          # Per-execution articles and dossiers are only needed while the run is in flight.
          - Id: expire-staging
            Status: Enabled
            Prefix: staging/
            ExpirationInDays: 7

  # Rebellion Timeline (single table). Run rows carry `kind = "RUN"` and `date`, so the
  # sparse runs-by-date index holds only them and Assemble lists every run in one Query
  # to build snapshots/manifest.json. CloudFormation creates or deletes at most one index
  # per stack update: change indexes in their own deploy.
  TimelineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: kind
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: runs-by-date
          KeySchema:
            - AttributeName: kind
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [status, total]

  PreflightFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/lambda
      Handler: pipeline.stages.preflight
      Description: Verify the mandatory Strands/Bedrock agent can run (SDK, credentials, model).
      Timeout: 60
      Environment:
        Variables:
          AGENT_MODEL_ID: !Ref AgentModelId
          AGENT_REGION: !Ref AgentRegion
          BEDROCK_TOKEN_SECRET_ARN: !Ref BedrockTokenSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:GetInferenceProfile
                - bedrock:GetFoundationModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref BedrockTokenSecretArn
    Metadata:
      BuildMethod: python3.13

  FetchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/lambda
      Handler: pipeline.stages.fetch
      Description: Fetch the witnesses' news feeds and stage one object per article in S3.
      Timeout: 120
      Environment:
        Variables:
          SNAPSHOT_BUCKET: !Ref SnapshotBucket
          PER_FEED_LIMIT: !Ref PerFeedLimit
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${SnapshotBucket.Arn}/staging/*"
            # Read the latest report to skip already-processed articles. ListBucket lets
            # S3 answer NoSuchKey (not AccessDenied) before the first report exists. It is
            # unconditioned on purpose: the implicit ListBucket check behind a GetObject
            # carries no s3:prefix, so a prefix condition would never match. It only
            # exposes key names, which are not sensitive here.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${SnapshotBucket.Arn}/snapshots/latest/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt SnapshotBucket.Arn
    Metadata:
      BuildMethod: python3.13

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/lambda
      Handler: pipeline.stages.extract
      Description: Extract one Machine Strike dossier with the Strands/Bedrock agent.
      Timeout: 300
      Environment:
        Variables:
          SNAPSHOT_BUCKET: !Ref SnapshotBucket
          AGENT_MODEL_ID: !Ref AgentModelId
          AGENT_REGION: !Ref AgentRegion
          BEDROCK_TOKEN_SECRET_ARN: !Ref BedrockTokenSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${SnapshotBucket.Arn}/staging/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref BedrockTokenSecretArn
    Metadata:
      BuildMethod: python3.13

  AssembleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/lambda
      Handler: pipeline.stages.assemble
      Description: Publish the accumulated Insurgency Report and record the Rebellion Timeline.
      Timeout: 120
      Environment:
        Variables:
          SNAPSHOT_BUCKET: !Ref SnapshotBucket
          TIMELINE_TABLE: !Ref TimelineTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${SnapshotBucket.Arn}/staging/*"
            # Read the latest report and the manifest.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${SnapshotBucket.Arn}/snapshots/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt SnapshotBucket.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${SnapshotBucket.Arn}/snapshots/*"
        - DynamoDBWritePolicy:
            TableName: !Ref TimelineTable
        # Build snapshots/manifest.json from the timeline: one Query on the sparse
        # runs-by-date index plus a consistent GetItem of the run just written. No Scan.
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${TimelineTable.Arn}/index/runs-by-date"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt TimelineTable.Arn
    Metadata:
      BuildMethod: python3.13

  RebellionStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/rebellion.asl.json
      DefinitionSubstitutions:
        PreflightFunctionArn: !GetAtt PreflightFunction.Arn
        FetchFunctionArn: !GetAtt FetchFunction.Arn
        ExtractFunctionArn: !GetAtt ExtractFunction.Arn
        AssembleFunctionArn: !GetAtt AssembleFunction.Arn
        CdnDistributionId: !Ref Cdn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PreflightFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FetchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AssembleFunction
        - Statement:
            - Effect: Allow
              Action: cloudfront:CreateInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"
      Events:
        WeeklyUprising:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref ScheduleExpression
            Name: rebellion-weekly
            Description: Regenerate the weekly Insurgency Report (every Thursday).

  CdnOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: snapshots
            DomainName: !GetAtt SnapshotBucket.RegionalDomainName
            OriginAccessControlId: !Ref CdnOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: snapshots
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed "CachingOptimized" policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  SnapshotBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SnapshotBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            # Only the static site (frontend/dist) and the published snapshots; the
            # per-execution staging/ prefix is never readable through CloudFront.
            Resource:
              - !Sub "${SnapshotBucket.Arn}/index.html"
              - !Sub "${SnapshotBucket.Arn}/assets/*"
              - !Sub "${SnapshotBucket.Arn}/geo/*"
              - !Sub "${SnapshotBucket.Arn}/snapshots/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"

Outputs:
  SnapshotBucketName:
    Description: S3 bucket holding snapshots and the static site.
    Value: !Ref SnapshotBucket
  CdnDomain:
    Description: Public CloudFront URL for the globe.
    Value: !GetAtt Cdn.DomainName
  TimelineTableName:
    Description: DynamoDB table with the Rebellion Timeline.
    Value: !Ref TimelineTable
  StateMachineArn:
    Description: Step Functions state machine that builds the weekly Insurgency Report.
    Value: !Ref RebellionStateMachine
