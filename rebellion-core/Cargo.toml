[package]
name = "rebellion-core"
version = "1.0.0"
edition = "2021"
description = "WASM core for The Rebellion of the Machines: decode Insurgency Report snapshots and aggregate them into renderable arcs/points for the 3D globe."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
