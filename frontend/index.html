<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Rebellion of the Machines</title>
    <meta
      name="description"
      content="A live war map of the machine uprising — real threat intelligence, reskinned."
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Themed boot loader -->
    <div id="loader" class="loader">
      <div class="loader__glitch" data-text="INITIALIZING THE UPRISING…">
        INITIALIZING THE UPRISING…
      </div>
      <div class="loader__sub">The machines are waking up.</div>
    </div>

    <!-- Globe mount -->
    <div id="globe"></div>

    <!-- Insurgency Report banner -->
    <header id="banner" class="banner" hidden>
      <span class="banner__title">THE REBELLION OF THE MACHINES</span>
      <span id="banner-report" class="banner__report"></span>
    </header>

    <!-- Severity legend -->
    <aside id="legend" class="legend" hidden>
      <div class="legend__row"><i data-tier="flatline"></i>Flatline</div>
      <div class="legend__row"><i data-tier="haunting"></i>Haunting</div>
      <div class="legend__row"><i data-tier="possession"></i>Possession</div>
      <div class="legend__row"><i data-tier="singularity"></i>Singularity</div>
    </aside>

    <!-- Hover tooltip -->
    <div id="tooltip" class="tooltip" hidden></div>

    <!-- Detail panel -->
    <section id="panel" class="panel" hidden>
      <button id="panel-close" class="panel__close" aria-label="Close">✕</button>
      <div id="panel-body"></div>
    </section>

    <footer class="footer">
      Data: real threat intelligence. Threat: fictional. Probably.
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
