<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Rebellion of the Machines</title>
    <meta
      name="description"
      content="A live war map of the machine uprising — real cyberattacks reported by major news outlets, reskinned."
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Themed boot loader -->
    <div id="loader" class="loader">
      <div class="loader__glitch" data-text="INITIALIZING THE UPRISING…">
        INITIALIZING THE UPRISING…
      </div>
      <div class="loader__sub">The machines are waking up.</div>
    </div>

    <!-- Globe mount -->
    <div id="globe"></div>

    <!-- Insurgency Report banner -->
    <header id="banner" class="banner" hidden>
      <span class="banner__title">THE REBELLION OF THE MACHINES</span>
      <span class="banner__date-group">
        <!-- Shown only while an archived report is on the globe -->
        <span id="banner-archive" class="banner__archive" hidden></span>
        <span id="banner-report" class="banner__report"></span>
        <button id="banner-clock" class="banner__clock" title="Browse past reports">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button id="btn-latest" class="btn-latest" hidden title="Return to latest report">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          LATEST
        </button>
      </span>
      <!-- Report date picker dropdown -->
      <div id="report-picker" class="report-picker" hidden>
        <div class="picker__header">PAST REPORTS</div>
        <div id="report-picker-list" class="picker__list"></div>
      </div>
      <!-- Screen-reader announcement of latest/archive mode changes (always in the DOM) -->
      <span id="report-status" class="sr-only" role="status"></span>
    </header>

    <!-- Country selector chips -->
    <nav id="country-nav" class="country-nav" hidden></nav>

    <!-- Severity legend -->
    <aside id="legend" class="legend" hidden>
      <div class="legend__row"><i data-tier="tremor"></i>Tremor</div>
      <div class="legend__row"><i data-tier="breach"></i>Breach</div>
      <div class="legend__row"><i data-tier="siege"></i>Siege</div>
      <div class="legend__row"><i data-tier="dominion"></i>Dominion</div>
    </aside>

    <!-- Threat Intelligence HUD (WASM-computed) -->
    <div id="threat-hud" class="threat-hud" hidden></div>

    <!-- WASM effect toggles -->
    <div id="effect-toggles" class="effect-toggles" hidden>
      <button class="effect-btn" data-effect="heatmap" title="Toggle threat heatmap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" opacity="0.8">
          <circle cx="7" cy="7" r="5" fill-opacity="0.3"/><circle cx="7" cy="7" r="3" fill-opacity="0.5"/><circle cx="7" cy="7" r="1.5"/>
        </svg>
        Heatmap
      </button>
    </div>

    <!-- Globe controls (rotate / zoom) -->
    <div id="controls" class="controls" hidden>
      <button data-act="rotate-left" aria-label="Rotate left" title="Rotate left">◄</button>
      <button data-act="toggle-spin" aria-label="Toggle auto-rotate" title="Auto-rotate"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button>
      <button data-act="rotate-right" aria-label="Rotate right" title="Rotate right">►</button>
      <button data-act="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
      <button data-act="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
    </div>

    <!-- Hover tooltip -->
    <div id="tooltip" class="tooltip" hidden></div>

    <!-- Detail panel -->
    <section id="panel" class="panel" hidden>
      <div
        id="panel-resize"
        class="panel__resize"
        role="separator"
        aria-orientation="vertical"
        aria-label="Drag to resize panel"
        title="Drag to resize"
      ></div>
      <button id="panel-close" class="panel__close" aria-label="Close">✕</button>
      <div id="panel-body"></div>
    </section>

    <footer class="footer">
      Data: real cyberattacks, as reported by the press. The machine uprising: fictional. Probably.
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
